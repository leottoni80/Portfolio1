  <style>
    /* ── VIDEOS HERO ────────────────────────────────────────────────
       Full-viewport section, dark bg, text bottom-left, overlapping images
    ─────────────────────────────────────────────────────────── */
    .videos-hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 680px;
      overflow: hidden;
      display: flex;
      align-items: center;           /* text anchors to center vertically */
      justify-content: center;       /* text anchors to center horizontally */
      background: var(--bg);
    }

    /* ── Background atmosphere ── */
    .videos-hero__bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 72% 40%,
          rgba(10,132,255,0.09) 0%, transparent 65%),
        radial-gradient(ellipse 40% 60% at 20% 80%,
          rgba(10,132,255,0.05) 0%, transparent 55%);
    }

    /* Diagonal accent stripe */
    .videos-hero__stripe {
      position: absolute;
      top: -10%; right: 22%;
      width: 1px;
      height: 130%;
      background: linear-gradient(180deg,
        transparent, rgba(10,132,255,0.22) 50%, transparent);
      transform: rotate(-18deg);
      transform-origin: top center;
      z-index: 1;
      pointer-events: none;
    }

    /* ── Portraits — absolute, anchored bottom-right, full height ── */
    .videos-hero__portrait {
      position: absolute;
      bottom: 5vh; /* Move pictures up */
      height: 100%;
      z-index: 2;
      pointer-events: none;
      user-select: none;
      will-change: transform;
    }

    .videos-hero__portrait--left {
      left: clamp(-80px, -5vw, -20px);
      right: auto;
      height: 110%; /* Restored conductor to original size */
      z-index: 1; 
transform: translateY(13vh);
    }

    .videos-hero__portrait--right {
      right: clamp(-240px, -15vw, -100px);
      left: auto;
      height: 100%; /* Made the violinist slightly smaller to match */
      z-index: 1; 

    }

    .videos-hero__portrait img {
      height: 100%;
      width: auto;
      object-fit: contain;
      object-position: bottom center;
      display: block;
      filter: drop-shadow(-10px 0 30px rgba(11,11,13,0.85));
    }
    
    /* Optional mask for left image to fade out where it overlaps */
    .videos-hero__portrait--left img {
      mask-image: linear-gradient(to right, black 50%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, black 50%, transparent 100%);
      object-position: bottom left;
    }
    
    .videos-hero__portrait--right img {
      mask-image: linear-gradient(to left, black 50%, transparent 100%);
      -webkit-mask-image: linear-gradient(to left, black 50%, transparent 100%);
      object-position: bottom right;
    }

    /* ── Vignette layer — pulls image into background, masks bottom ── */
    .videos-hero__vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        /* Edge fade */
        linear-gradient(90deg, rgba(11,11,13,0.7) 0%, transparent 20%, transparent 80%, rgba(11,11,13,0.7) 100%),
        /* Bottom fade */
        linear-gradient(0deg, var(--bg) 0%, rgba(11,11,13,0.8) 12%, transparent 30%),
        /* Top fade */
        linear-gradient(180deg, rgba(11,11,13,0.4) 0%, transparent 15%);
    }

    /* ── Text block — bottom-left, over vignette ── */
    .videos-hero__content {
      position: relative;
      z-index: 4;
      padding: 0 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .videos-hero__eyebrow {
      font-family: var(--body);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      opacity: 0;
      animation: vheroUp 0.8s var(--ease) 0.2s forwards;
    }

    .videos-hero__name {
      font-family: var(--display);
      font-size: clamp(4rem, 11vw, 11rem);
      line-height: 0.92;
      letter-spacing: 0.01em;
      color: var(--text);
      margin-bottom: 20px;
      opacity: 0;
      animation: vheroUp 1s var(--ease) 0.4s forwards;
    }
    .videos-hero__name em {
      display: block;
      color: var(--accent);
      font-style: normal;
    }

    .videos-hero__divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      opacity: 0;
      animation: vheroUp 0.7s var(--ease) 0.65s forwards;
    }
    .videos-hero__divider-line {
      width: 40px; height: 1px;
      background: var(--accent);
    }

    .videos-hero__subtitle {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: vheroUp 0.7s var(--ease) 0.75s forwards;
    }

    /* Logo watermark — bottom-right corner */
    .videos-hero__logo-wm {
      position: absolute;
      bottom: clamp(28px, 4vh, 52px);
      right: clamp(20px, 3vw, 48px);
      z-index: 5;
      opacity: 0;
      animation: vheroFade 1s ease 1s forwards;
    }
    .videos-hero__logo-wm img {
      height: clamp(56px, 7vw, 96px);
      width: auto;
      filter: invert(1) brightness(1)
              drop-shadow(0 0 16px rgba(10,132,255,0.35));
      opacity: 0.18;
    }

    @keyframes vheroUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes vheroFade {
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      .videos-hero__portrait { height: 70%; }
      .videos-hero__portrait--left { left: 0; right: auto; }
      .videos-hero__portrait--right { right: 0; left: auto; }
      .videos-hero__name { font-size: clamp(3rem, 14vw, 5.5rem); }
    }
    @media (max-width: 480px) {
      .videos-hero__portrait { height: 55%; opacity: 0.6; }
    }

    /* ── Grid wrapper: padding so cards don't touch screen edges */
    .videos-section {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 48px;
    }

    @media (max-width: 600px) {
      .videos-section { padding: 0 20px; }
    }

    /* ── Thumbnail-only video card ──────────────────────────── */
    .video-card {
      display: block;
      text-decoration: none;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border, rgba(255,255,255,0.12));
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent, #c9a84c);
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    .video-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s ease;
    }

    .video-card:hover img {
      opacity: 0.85;
    }

    /* Play button overlay */
    .video-card-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .video-card:hover .video-card-play {
      opacity: 1;
    }

    .video-card-play-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      border: 2px solid var(--accent, #c9a84c);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-card-play-circle svg {
      margin-left: 4px;
    }

    /* ── Videos grid: 3 columns, generous gap ───────────────── */
    .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 36px;
    }

    @media (max-width: 860px) {
      .videos-grid { grid-template-columns: repeat(2, 1fr); gap: 24px; }
    }

    @media (max-width: 540px) {
      .videos-grid { grid-template-columns: 1fr; gap: 20px; }
    }

    /* ── Filter: hide non-matching cards completely ─────────── */
    .video-card.hidden {
      display: none;
    }
  </style>

  <script>
    /* ── Filter: hide / show cards completely ─────────────── */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.dataset.filter;

        document.querySelectorAll('.video-card').forEach(card => {
          if (filter === 'all' || card.dataset.category === filter) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });
      });
    });
  </script>
